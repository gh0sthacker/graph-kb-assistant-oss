[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-graph-assistant"
version = "0.1.0"
description = "Local-first assistant for exploring Caido HTTP history and a sourced knowledge base"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/gh0sthacker/graph-kb-assistant-oss"
Repository = "https://github.com/gh0sthacker/graph-kb-assistant-oss"

[project.optional-dependencies]
kb = ["PyYAML>=6"]
mcp = ["mcp>=2,<3"]
test = ["pytest>=8"]

[project.scripts]
bb-assistant-kb = "bb_assistant.kb.cli:main"
bb-assistant-mcp = "bb_assistant.mcp_server:main"
bb-assistant-tools = "bb_assistant.tools:main"
bb-assistant-caido-import = "bb_assistant.caido_import_cli:main"
bb-assistant-caido-tail = "bb_assistant.caido_tail_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bb_assistant = ["kb/*.yaml"]
